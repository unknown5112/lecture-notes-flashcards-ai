<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Lecture Note-Taker & Flashcards</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-block bg-sky-950/80 border border-sky-800 text-sky-400 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">Fast Serverless AI Engine</div>
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400">Lecture Note-Taker AI</h1>
      <p class="text-slate-400 text-sm">Paste any YouTube lecture link OR notes to get unique summaries and flashcards.</p>
    </div>

    <!-- Input Box -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <label for="user-input" class="text-xs font-semibold uppercase tracking-wider text-slate-400">YouTube URL or Study Notes</label>
        <button onclick="loadSampleData()" class="text-xs text-sky-400 hover:text-sky-300 font-medium underline">Load CS Sample Data</button>
      </div>

      <textarea id="user-input" rows="4" placeholder="Paste YouTube link (e.g. [https://www.youtube.com/watch?v=6hfOvs8pY1k](https://www.youtube.com/watch?v=6hfOvs8pY1k)) or paste lecture text..." class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none focus:border-sky-500 text-slate-200"></textarea>

      <button onclick="processLecture()" id="process-btn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium py-2.5 rounded-xl text-sm transition">Generate Notes & Flashcards</button>
    </div>

    <div id="loader" class="hidden text-center text-sky-400 text-sm py-3 animate-pulse">Analyzing content & synthesizing flashcards with Gemini...</div>
    <div id="error-box" class="hidden bg-rose-950/40 border border-rose-800 text-rose-300 p-4 rounded-xl text-sm leading-relaxed"></div>

    <!-- Output Section -->
    <div id="results" class="hidden space-y-6">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow">
        <h2 class="text-base font-bold text-sky-400 mb-3 uppercase tracking-wider text-xs">Structured Notes & Key Takeaways</h2>
        <div id="summary-content" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow">
        <h2 class="text-base font-bold text-indigo-400 mb-4 uppercase tracking-wider text-xs">Interactive Revision Flashcards</h2>
        <div id="flashcards-list" class="grid gap-3"></div>
      </div>
    </div>
  </div>

  <script>
    function loadSampleData() {
      document.getElementById('user-input').value = "[https://www.youtube.com/watch?v=6hfOvs8pY1k](https://www.youtube.com/watch?v=6hfOvs8pY1k)";
    }

    async function processLecture() {
      const inputVal = document.getElementById('user-input').value.trim();
      const loader = document.getElementById('loader');
      const errBox = document.getElementById('error-box');
      const results = document.getElementById('results');
      const btn = document.getElementById('process-btn');

      if (!inputVal) {
        errBox.innerText = "Please paste a YouTube link or text first.";
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      results.classList.add('hidden');
      loader.classList.remove('hidden');
      btn.disabled = true;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: inputVal })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error generating notes');

        document.getElementById('summary-content').innerText = data.summary;
        const list = document.getElementById('flashcards-list');
        list.innerHTML = '';
        (data.flashcards || []).forEach((fc, idx) => {
          list.innerHTML += `
            <div class="bg-slate-950 p-4 border border-slate-800 rounded-xl space-y-2">
              <p class="text-sm font-semibold text-slate-200">Q${idx+1}: ${fc.question}</p>
              <div class="text-xs text-sky-300 bg-slate-900 p-2.5 rounded-lg border border-slate-800">Ans: ${fc.answer}</div>
            </div>
          `;
        });
        results.classList.remove('hidden');
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      } finally {
        loader.classList.add('hidden');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
